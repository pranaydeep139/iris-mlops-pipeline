name: Iris Model CI Pipeline

on:
  push:
    branches: [ dev ]  # Trigger on pushes to the dev branch
  pull_request:
    branches: [ main ] # Trigger on pull requests to the main branch

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt # Assuming you have a requirements.txt
          pip install pytest "cml>=0.2.0"

      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Pull Data and Model from DVC
        run: |
          dvc pull -v

      - name: Run Pytest and Generate Report
        run: |
          pytest > report.txt

      - name: Create CML Report
        env:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Send the pytest report as a comment to the PR/commit
          cml comment create report.txt
