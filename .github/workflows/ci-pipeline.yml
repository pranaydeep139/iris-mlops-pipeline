name: Iris Model CI Pipeline

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # --- THIS STEP IS CORRECTED ---
      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest # We install pytest separately

      # --- THIS IS THE NEW, CORRECT STEP FOR CML ---
      - name: Set up CML
        uses: iterative/setup-cml@v1

      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Pull Data and Model from DVC
        env:
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.GCP_SA_KEY }} # DVC also needs the credentials
        run: |
          dvc pull -v

      - name: Run Pytest and Generate Report
        # We redirect stderr to stdout to capture everything in the report
        run: |
          pytest tests/test_model.py > report.txt 2>&1

      - name: Create CML Report
        env:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Send the contents of report.txt as a comment
          cml comment create report.txt
